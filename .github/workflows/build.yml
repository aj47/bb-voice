# Builds an Android APK and an unsigned iOS IPA.
# Runs on demand (Actions → Build → Run workflow) and on `v*` tags, which also
# attach both files to a GitHub Release.
#
# The APK is signed with the debug key, fine for sideloading. The IPA is
# unsigned: install it with Sideloadly or AltStore, which re-sign it with your
# Apple ID.

name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild -p android --no-install
      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - run: cp android/app/build/outputs/apk/release/app-release.apk bb-voice.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bb-voice-android
          path: bb-voice.apk

  ios:
    runs-on: macos-15
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo prebuild -p ios
      - name: Archive without signing
        run: |
          xcodebuild archive \
            -workspace ios/bbvoice.xcworkspace \
            -scheme bbvoice \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/bbvoice.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/bbvoice.xcarchive/Products/Applications/*.app Payload/
          zip -qry bb-voice-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: bb-voice-ios
          path: bb-voice-unsigned.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bb-voice.apk
            bb-voice-unsigned.ipa
          generate_release_notes: true
